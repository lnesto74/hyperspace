# Mosquitto MQTT Broker - Production Configuration
# Optimized for low-latency trajectory delivery

# Listen on all interfaces (Docker network + host via port mapping)
listener 1883 0.0.0.0

# No authentication (internal network only, Tailscale handles auth)
allow_anonymous true

# Performance: disable persistence (in-memory only = lowest latency)
# Trajectories are transient; no need to persist MQTT messages
persistence false

# Buffer bridged bursts when backend subscriber is momentarily slow
max_queued_messages 50000

# Max in-flight messages (higher = better throughput for trajectory bursts)
max_inflight_messages 200

# Message size limit (trajectory payloads are small, ~1KB)
message_size_limit 65536

# Connection limits
max_connections -1

# Logging (minimal for performance)
log_dest stdout
log_type error
log_type warning
