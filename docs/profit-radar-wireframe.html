<!-- Cluster Algorithm -->
<h3 class="text-lg font-bold mt-8 mb-3">Behavior Cluster Algorithm <span class="text-xs bg-pink-500/15 text-pink-400 px-2 py-0.5 rounded font-semibold ml-2">TRAJECTORY-ENRICHED</span></h3>
<div class="grid grid-cols-2 gap-4">
<div class="c p-5">
<div class="text-xs font-bold text-pink-400 uppercase mb-2">Clustering Logic (server-side)</div>
<div class="text-sm text-[#8b8fa3] space-y-2">
<div><strong class="text-white">1. Group by dominant axis</strong> — for each active track, find argmax(intentAxes). Tracks with same dominant axis are candidates.</div>
<div><strong class="text-white">2. Spatial proximity</strong> — within candidates, find groups of 2+ tracks within <span class="text-indigo-400 font-mono">CLUSTER_RADIUS = 2.0m</span>. Simple radius-based grouping.</div>
<div><strong class="text-white">3. Enrich with trajectory</strong> — for each cluster member, look up their zone visit history from TrackAggregator trail buffer:</div>
<div class="pl-4 space-y-1 text-xs">
<div>• <strong class="text-white">zonePath</strong> — ordered list of zones visited (e.g. ["dairy","bakery","checkout"])</div>
<div>• <strong class="text-white">stopCount</strong> — number of stops (speed &lt; 0.1m/s for &gt;2s)</div>
<div>• <strong class="text-white">avgDwell</strong> — mean stop duration at current zone</div>
<div>• <strong class="text-white">journeyType</strong> — derived label: <span class="text-indigo-400">quick-run</span> (≤2 zones) · <span class="text-indigo-400">category-specialist</span> (1 long stop) · <span class="text-indigo-400">full-shop</span> (5+ zones) · <span class="text-indigo-400">browse-and-bail</span> (many zones, short dwell, no checkout)</div>
</div>
<div><strong class="text-white">4. Compute cluster summary</strong> — intersection of member zone paths, mean dwell, most common journey type.</div>
<div><strong class="text-white">5. Emit</strong> — each cluster: centroid, members, dominant axis, intensity, + trajectory context. At 0.5Hz.</div>
</div>
</div>
<div class="c p-5">
<div class="text-xs font-bold text-pink-400 uppercase mb-2">Socket.IO Payload (enriched)</div>
<div class="c2 p-3 font-mono text-xs text-indigo-300 leading-relaxed">
<div><span class="text-[#8b8fa3]">// semantics:zoneField payload</span></div>
<div>{</div>
<div class="pl-3">zones: { ... },</div>
<div class="pl-3 text-pink-400">clusters: [</div>
<div class="pl-6">{</div>
<div class="pl-8">centroidX, centroidZ,</div>
<div class="pl-8">memberCount: 3,</div>
<div class="pl-8">dominantAxis: "hesitation",</div>
<div class="pl-8">intensity: 0.72,</div>
<div class="pl-8">radius: 1.8,</div>
<div class="pl-8 text-amber-300">// trajectory context</div>
<div class="pl-8 text-amber-300">commonZones: ["dairy","bakery"],</div>
<div class="pl-8 text-amber-300">avgDwellSec: 40,</div>
<div class="pl-8 text-amber-300">stopCount: 3,</div>
<div class="pl-8 text-amber-300">journeyType: "quick-run"</div>
<div class="pl-6">}</div>
<div class="pl-3 text-pink-400">]</div>
<div>}</div>
</div>
<div class="text-xs text-[#8b8fa3] mt-3"><strong>Frontend label:</strong> Line 1 = <span class="text-white">"3× hesitating"</span> (intent). Line 2 = <span class="text-amber-300">"dairy→bakery · avg 40s"</span> (trajectory). CSS2D sprite, 2-line pill. Dissolves when memberCount &lt; 2.</div>
</div>
</div>
