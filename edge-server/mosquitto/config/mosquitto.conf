# Mosquitto Configuration for Edge Server
# Local broker with bridge to production
#
# Docker host network: port 1883 is on the HOST. If you see "Address in use", something else
# already binds 1883 (often apt package mosquitto): sudo systemctl stop mosquitto && sudo systemctl disable mosquitto

# Basic settings (bind all interfaces so Docker port publish / host network work)
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# Log to stdout (docker compose logs) — avoids volume permission errors on ./mosquitto/log
log_dest stdout
log_type error
log_type warning
log_type notice

# ============================================
# Bridge to Production (DigitalOcean)
# ============================================
connection hyperspace-prod
address 100.76.196.2:1883

# Bridge all trajectory topics to production
topic hyperspace/trajectories/# out 1

# Reconnect settings
restart_timeout 5
try_private false
cleansession true
