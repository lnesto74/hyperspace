services:
  # Local MQTT broker with bridge to production.
  # Host network (Linux): uses host routing/Tailscale so the bridge can reach 100.x brokers.
  # Perception on the host publishing to 127.0.0.1:1883 still hits this broker.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: edge-mosquitto
    network_mode: host
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    # "always", not "unless-stopped": any manual or scripted "compose down"
    # leaves unless-stopped containers marked as explicitly stopped, so they stay
    # down across the next reboot.
    restart: always

  edge-lidar:
    build: .
    container_name: edge-lidar-server
    ports:
      - "8080:8080"
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/backend/data
      # Mounted from the host so the adapter survives a container recreate and can be
      # updated without a rebuild. The store network blocks Docker Hub, so the base
      # image cannot be re-pulled on site and `compose build` fails there.
      - ./backend/perception-adapter.js:/app/backend/perception-adapter.js
      - ./mosquitto/config:/app/mosquitto/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=8080
      # Mosquitto is on the host network; not reachable as localhost inside this container.
      - MQTT_BROKER=mqtt://host.docker.internal:1883
    depends_on:
      - mosquitto
    restart: always
